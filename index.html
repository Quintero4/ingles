
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis palabras en inglés - Unidad 2</title>

<link href="https://fonts.googleapis.com/css2?family=Playwrite+ES+Deco:wght@400&display=swap" rel="stylesheet">

<style>
:root {
  --fondo: #f6f7f3;
  --verde: #dcece6;
  --verde-oscuro: #235d54;
  --texto: #2d3b3a;
  --borde: #dbe3de;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font-family: "Playwrite ES Deco", cursive;
  text-align: center;
}

main {
  max-width: 950px;
  margin: auto;
  padding: 25px 15px 50px;
}

h1 {
  font-size: clamp(24px, 4vw, 36px);
  font-weight: 400;
}

h2 {
  font-size: 22px;
  font-weight: 400;
  margin-top: 35px;
}

p {
  font-size: 14px;
}

button {
  font-family: inherit;
  cursor: pointer;
}

button:focus-visible {
  outline: 3px solid #986c30;
  outline-offset: 3px;
}

nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 30px 0;
}

.tab {
  background: white;
  border: 1px solid var(--borde);
  border-radius: 12px;
  padding: 12px 20px;
  color: var(--texto);
}

.tab.active {
  background: var(--verde);
  border-color: #9abfae;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-top: 20px;
}

.card {
  border: 1px solid var(--borde);
  border-radius: 18px;
  background: white;
  padding: 20px 10px;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.card:hover {
  background: #f0f6f2;
}

.dibujo {
  font-family: system-ui, sans-serif;
  font-size: 42px;
  background: #edf4f0;
  border-radius: 17px;
  width: 75px;
  height: 75px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ingles {
  font-size: 25px;
  line-height: 1.9;
  font-weight: 400;
}

.espanol {
  color: #5f706e;
  font-size: 15px;
}

.frases {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 20px;
}

.frase {
  background: white;
  border: 1px solid var(--borde);
  border-radius: 15px;
  padding: 17px;
  color: var(--texto);
  font-size: 17px;
  line-height: 2;
}

.frase small {
  display: block;
  color: #5f706e;
  font-size: 13px;
}

.panel {
  max-width: 620px;
  margin: 25px auto;
  padding: 25px;
  background: white;
  border: 1px solid var(--borde);
  border-radius: 20px;
}

.escuchar {
  background: var(--verde);
  color: var(--verde-oscuro);
  border: none;
  border-radius: 15px;
  padding: 17px;
  font-size: 18px;
  margin: 20px 0;
}

.respuestas {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.respuesta {
  background: white;
  border: 1px solid var(--borde);
  border-radius: 13px;
  padding: 15px 7px;
  font-size: 17px;
  min-height: 100px;
}

.respuesta .dibujo {
  margin: 0 auto 5px;
  width: 52px;
  height: 52px;
  font-size: 29px;
}

.respuesta.correcta {
  background: #e4f1e9;
  border-color: #79ae94;
}

.respuesta.incorrecta {
  background: #f8efe5;
  border-color: #dec49d;
}

.siguiente {
  border: none;
  background: var(--verde-oscuro);
  color: white;
  border-radius: 12px;
  padding: 12px 22px;
  font-size: 16px;
  margin-top: 15px;
}

[hidden] {
  display: none !important;
}

#mensaje {
  min-height: 55px;
  margin-top: 15px;
}

@media (max-width: 650px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .frases, .respuestas {
    grid-template-columns: 1fr;
  }

  .ingles {
    font-size: 21px;
  }

  .card {
    min-height: 165px;
  }
}
</style>
</head>

<body>
<main>

<header>
  <p>INGLÉS · UNIDAD 2</p>
  <h1>Mis palabras en inglés</h1>
  <p>Escucho, aprendo y juego a mi ritmo.</p>
</header>

<nav>
  <button class="tab active" id="botonPalabras"
    onclick="mostrar('palabras')">
    📖 Mis palabras
  </button>

  <button class="tab" id="botonJuego"
    onclick="mostrar('juego')">
    🎧 Juego de escuchar
  </button>
</nav>

<section id="palabras">
  <h2>Mi familia</h2>
  <p>Toca cada dibujo para escuchar su palabra.</p>
  <div class="grid" id="familia"></div>

  <h2>¿Cómo somos?</h2>
  <div class="grid" id="descripciones"></div>

  <h2>Frases para practicar</h2>
  <div class="frases" id="frases"></div>
</section>

<section id="juego" hidden>
  <div class="panel">
    <h2>¿Qué palabra escuchas?</h2>
    <p>Escucha y elige la respuesta correcta.</p>

    <button class="escuchar" onclick="escucharPregunta()">
      🔊 Escuchar palabra
    </button>

    <div class="respuestas" id="respuestas"></div>
    <p id="mensaje" aria-live="polite"></p>

    <button class="siguiente" id="siguiente"
      onclick="nuevaPregunta()" hidden>
      Siguiente palabra →
    </button>

    <p id="progreso"></p>
  </div>
</section>

<p>🔊 Escucha las palabras tantas veces como quieras.</p>

</main>

<script>
"use strict";

const familia = [
  ["Mum", "mamá", "👩"],
  ["Dad", "papá", "👨"],
  ["Brother", "hermano", "👦"],
  ["Sister", "hermana", "👧"],
  ["Grandpa", "abuelo", "👴"],
  ["Grandma", "abuela", "👵"],
  ["Uncle", "tío", "🧔"],
  ["Aunt", "tía", "👩"]
];

const descripciones = [
  ["Old", "mayor / anciano", "👴"],
  ["Young", "joven", "🧒"],
  ["Tall", "alto / alta", "⬆️"],
  ["Short", "bajo / baja", "⬇️"]
];

const frases = [
  ["This is my mum.", "Esta es mi mamá."],
  ["This is my dad.", "Este es mi papá."],
  ["Is this your brother?", "¿Es este tu hermano?"],
  ["Yes, it is.", "Sí, lo es."],
  ["No, it isn't.", "No, no lo es."]
];

const todas = [...familia, ...descripciones];

function pronunciar(texto) {
  if (!("speechSynthesis" in window)) {
    alert("Este navegador no admite reproducción de voz.");
    return;
  }

  speechSynthesis.cancel();

  const audio = new SpeechSynthesisUtterance(texto);
  audio.lang = "en-GB";
  audio.rate = 0.82;
  audio.pitch = 1;

  const voces = speechSynthesis.getVoices();
  audio.voice =
    voces.find(v => /^en[-_]GB$/i.test(v.lang)) ||
    voces.find(v => /^en[-_]/i.test(v.lang)) ||
    null;

  speechSynthesis.speak(audio);
}

function crearTarjetas(lista, destino) {
  const contenedor = document.getElementById(destino);

  lista.forEach(([ingles, espanol, dibujo]) => {
    const boton = document.createElement("button");
    boton.className = "card";
    boton.type = "button";

    boton.innerHTML = `
      <span class="dibujo" aria-hidden="true">${dibujo}</span>
      <span class="ingles">${ingles.toLowerCase()}</span>
      <span class="espanol">${espanol}</span>
    `;

    boton.onclick = () => pronunciar(ingles);
    contenedor.appendChild(boton);
  });
}

crearTarjetas(familia, "familia");
crearTarjetas(descripciones, "descripciones");

frases.forEach(([ingles, espanol]) => {
  const boton = document.createElement("button");
  boton.className = "frase";
  boton.type = "button";

  const titulo = document.createElement("span");
  titulo.textContent = "🔊 " + ingles;

  const traduccion = document.createElement("small");
  traduccion.textContent = espanol;

  boton.append(titulo, traduccion);
  boton.onclick = () => pronunciar(ingles);

  document.getElementById("frases").appendChild(boton);
});

let preguntaActual = null;
let numeroPregunta = 0;
let contestada = false;
let pendientes = [];

function mezclar(lista) {
  const copia = [...lista];

  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }

  return copia;
}

function mostrar(seccion) {
  speechSynthesis?.cancel();

  const esJuego = seccion === "juego";

  document.getElementById("palabras").hidden = esJuego;
  document.getElementById("juego").hidden = !esJuego;

  document.getElementById("botonPalabras")
    .classList.toggle("active", !esJuego);

  document.getElementById("botonJuego")
    .classList.toggle("active", esJuego);

  if (esJuego && !preguntaActual) {
    nuevaPregunta();
  }
}

function nuevaPregunta() {
  if (pendientes.length === 0) {
    pendientes = mezclar(todas);
  }

  preguntaActual = pendientes.pop();
  numeroPregunta++;
  contestada = false;

  const contenedor = document.getElementById("respuestas");
  contenedor.replaceChildren();

  document.getElementById("mensaje").textContent = "";
  document.getElementById("siguiente").hidden = true;

  const incorrectas = mezclar(
    todas.filter(p => p[0] !== preguntaActual[0])
  ).slice(0, 2);

  const opciones = mezclar([
    preguntaActual,
    ...incorrectas
  ]);

  opciones.forEach(([ingles, espanol, dibujo]) => {
    const boton = document.createElement("button");
    boton.className = "respuesta";
    boton.type = "button";

    boton.innerHTML = `
      <span class="dibujo" aria-hidden="true">${dibujo}</span>
      <span>${ingles.toLowerCase()}</span>
    `;

    boton.onclick = () => comprobar(ingles, boton);
    contenedor.appendChild(boton);
  });

  document.getElementById("progreso").textContent =
    "Palabra " + numeroPregunta;
}

function escucharPregunta() {
  if (preguntaActual) {
    pronunciar(preguntaActual[0]);
  }
}

function comprobar(palabra, boton) {
  if (contestada) return;

  const mensaje = document.getElementById("mensaje");

  if (palabra === preguntaActual[0]) {
    contestada = true;
    boton.classList.add("correcta");

    mensaje.textContent =
      "¡Muy bien! " + preguntaActual[0] +
      " significa " + preguntaActual[1] + ".";

    document.querySelectorAll(".respuesta").forEach(b => {
      b.disabled = true;
    });

    document.getElementById("siguiente").hidden = false;
    pronunciar(preguntaActual[0]);

  } else {
    boton.classList.add("incorrecta");
    boton.disabled = true;

    mensaje.textContent =
      "Prueba otra vez. Puedes escuchar la palabra de nuevo.";
  }
}
</script>
</body>
</html>
